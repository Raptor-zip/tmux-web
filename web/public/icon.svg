<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="tmux web">
  <!-- タイル状に分割したペインを象る。16px まで縮んでも形が残るよう、
       線ではなく塗りで構成している（細い stroke は縮小で消える） -->
  <rect width="64" height="64" rx="14" fill="#0d1117"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#262e39" stroke-width="2"/>

  <!-- 左の大ペイン。プロンプト記号は背景色で抜く -->
  <rect x="11" y="13" width="23" height="38" rx="3" fill="#6ee7ff"/>
  <path d="M16 24l5 4-5 4" fill="none" stroke="#0d1117" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="23" y="34" width="7" height="3" rx="1.5" fill="#0d1117"/>

  <!-- 右の 2 ペイン -->
  <rect x="38" y="13" width="15" height="17" rx="3" fill="#6ee7ff" opacity="0.55"/>
  <rect x="38" y="34" width="15" height="17" rx="3" fill="#7ee787" opacity="0.75"/>
</svg>
