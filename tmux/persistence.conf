# tmux-web: セッションの保存と復元
#
# このファイルは scripts/install-persistence.sh が
# ~/.config/tmux-web/persistence.conf に展開し、~/.tmux.conf から source-file される。
# @@REPO_DIR@@ はインストール時にクローン先の絶対パスへ置換される。
#
# resurrect  : ウィンドウ構成・ペイン分割・cwd・画面内容を保存／復元する
# continuum  : tmux サーバ起動時の自動復元を担う
# TPM は使わない。~/.tmux/plugins/ に直接 clone してある。
#
# 自動保存について:
#   continuum の自動保存は status-right の #() 展開で駆動する。tmux-web はブラウザ用の
#   ミラーセッションを `status off` で作るので、ブラウザだけで使っていると status-right が
#   評価されず自動保存が止まる（実際に丸一日保存されないことがあった）。
#   そのため systemd がある環境では @@SAVE_INTERVAL@@ を 0（＝continuum の自動保存は無効）
#   にして、scripts/resurrect-autosave.sh を systemd --user のタイマーで回す。
#   systemd が無い環境では従来どおり continuum の 15 分間隔にフォールバックする。

set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '@@SAVE_INTERVAL@@'
set -g @continuum-restore 'on'

# claude の会話は resurrect の対象外（プロセスを勝手に起こさない）。
# 代わりに保存のたびに claude-sessions の復元リストも更新しておく。
# --from-tmux はペインの pid から会話を引けず何も保存しないので、mtime で拾う既定モードを使う。
# あわせて tmux-web のミラーセッション（webmux-*）を保存から落とす。復元しても
# attach 先のない抜け殻になるだけなので残さない。
set -g @resurrect-hook-post-save-all 'claude-sessions --save >/dev/null 2>&1; @@REPO_DIR@@/scripts/resurrect-strip-mirrors.sh >/dev/null 2>&1 || true'

run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
