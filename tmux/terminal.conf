# 通常の端末でも tmux の履歴をホイールで読めるようにする。
set -g mouse on
set -g history-limit 50000

# copy-mode とマウス対応アプリには、そのままホイールを渡す。
# 全画面CLIの履歴はアプリ側にある。マウス非対応なら PageUp/PageDown を
# 送り、空の tmux 履歴に入ったり、Up/Down で入力履歴を選んだりしない。
bind -n WheelUpPane {
    select-pane -t=
    if -F -t= '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
        send-keys -M
    } {
        if -F -t= '#{alternate_on}' {
            send-keys -t= PPage
        } {
            copy-mode -e -t=
            send-keys -M
        }
    }
}
bind -n WheelDownPane {
    select-pane -t=
    if -F -t= '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
        send-keys -M
    } {
        if -F -t= '#{alternate_on}' { send-keys -t= NPage }
    }
}
